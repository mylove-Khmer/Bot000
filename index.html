<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធបកប្រែវីដេអូប្ដូរសំឡេងខ្មែរ AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Kantumruy Pro', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-indigo-500 to-purple-600 p-2.5 rounded-xl shadow-lg">
                    <i class="fa-solid fa-wand-magic-sparkles text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-white">Khmer AI Video Dubber</h1>
                    <p class="text-xs text-slate-400">ប្រព័ន្ធបកប្រែនិងអធិប្បាយសំឡេងខ្មែរពិតប្រាកដ</p>
                </div>
            </div>
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <span class="w-2 h-2 mr-1.5 bg-emerald-500 rounded-full animate-pulse"></span> Gemini API Ready
            </span>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-1 space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <h2 class="text-lg font-semibold mb-4 text-indigo-400">
                    <i class="fa-solid fa-cloud-arrow-up mr-2"></i> ដាក់បញ្ចូលវីដេអូ
                </h2>
                
                <div id="dropZone" class="border-2 border-dashed border-slate-700 hover:border-indigo-500 rounded-xl p-6 text-center cursor-pointer bg-slate-950/50">
                    <input type="file" id="videoFile" accept="video/*" class="hidden">
                    <div class="w-12 h-12 rounded-full bg-indigo-500/10 text-indigo-400 mx-auto flex items-center justify-center mb-3">
                        <i class="fa-solid fa-video text-xl"></i>
                    </div>
                    <p class="text-sm font-medium text-slate-300">ទម្លាក់វីដេអូទីនេះ ឬ <span class="text-indigo-400 underline">ជ្រើសរើសឯកសារ</span></p>
                </div>

                <div id="fileInfo" class="mt-4 hidden p-3 bg-slate-950 rounded-lg border border-slate-800 flex items-center justify-between">
                    <span id="fileName" class="text-sm truncate text-slate-200"></span>
                    <button onclick="removeFile()" class="text-slate-400 hover:text-red-400"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <div class="mt-6 space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">សំឡេង AI (Khmer Voice)</label>
                        <select id="voiceType" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-200">
                            <option value="km-KH-Standard-A">សំឡេងស្ត្រី (Standard A)</option>
                            <option value="km-KH-Standard-B">សំឡេងបុរស (Standard B)</option>
                        </select>
                    </div>

                    <button onclick="uploadAndProcess()" id="processBtn" disabled class="w-full mt-4 bg-gradient-to-r from-indigo-600 to-purple-600 disabled:opacity-50 text-white font-medium py-3 rounded-xl shadow-lg flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-play"></i>
                        <span>ចាប់ផ្តើមបកប្រែ និងប្តូរសំឡេងខ្មែរ</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="lg:col-span-2 space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col h-full min-h-[450px]">
                <h2 class="text-lg font-semibold mb-4 text-indigo-400">
                    <i class="fa-solid fa-display mr-2"></i> លទ្ធផលវីដេអូ
                </h2>
                
                <div id="displayArea" class="flex-grow bg-slate-950 rounded-xl border border-slate-800 flex flex-col items-center justify-center p-6 text-center relative">
                    <div id="placeholderState" class="space-y-3">
                        <div class="w-16 h-16 rounded-full bg-slate-900 text-slate-600 mx-auto flex items-center justify-center text-2xl">
                            <i class="fa-solid fa-film"></i>
                        </div>
                        <p class="text-sm text-slate-400">សូមផ្ទុកវីដេអូ និងចុចប៊ូតុងដើម្បីចាប់ផ្តើម</p>
                    </div>

                    <div id="processingState" class="hidden space-y-4 w-full max-w-md">
                        <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                        <p class="text-sm text-slate-300" id="statusText">កំពុងដំណើរការជាមួយ Gemini API និងបង្កើតសំឡេងខ្មែរ...</p>
                    </div>

                    <div id="resultState" class="hidden w-full h-full flex flex-col items-center justify-center space-y-4">
                        <video id="outputVideo" controls class="w-full max-h-[320px] rounded-lg shadow-lg bg-black"></video>
                        <a id="downloadLink" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2.5 rounded-xl text-sm font-medium flex items-center space-x-2">
                            <i class="fa-solid fa-download"></i>
                            <span>ទាញយកវីដេអូ (Khmer Dubbed)</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const dropZone = document.getElementById('dropZone');
        const videoFileInput = document.getElementById('videoFile');
        const fileInfo = document.getElementById('fileInfo');
        const fileNameSpan = document.getElementById('fileName');
        const processBtn = document.getElementById('processBtn');
        let selectedFile = null;

        dropZone.addEventListener('click', () => videoFileInput.click());
        videoFileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                fileNameSpan.textContent = selectedFile.name;
                fileInfo.classList.remove('hidden');
                processBtn.disabled = false;
            }
        });

        function removeFile() {
            selectedFile = null;
            videoFileInput.value = '';
            fileInfo.classList.add('hidden');
            processBtn.disabled = true;
        }

        async function uploadAndProcess() {
            if (!selectedFile) return;
            
            document.getElementById('placeholderState').classList.add('hidden');
            document.getElementById('processingState').classList.remove('hidden');
            processBtn.disabled = true;

            const formData = new FormData();
            formData.append('video', selectedFile);
            formData.append('voice', document.getElementById('voiceType').value);

            try {
                const response = await fetch('/api/process-video', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.success) {
                    document.getElementById('processingState').classList.add('hidden');
                    document.getElementById('resultState').classList.remove('hidden');
                    document.getElementById('outputVideo').src = data.outputUrl;
                    document.getElementById('downloadLink').href = data.outputUrl;
                } else {
                    alert('មានបញ្ហា: ' + data.error);
                    location.reload();
                }
            } catch (err) {
                alert('កំហុសប្រព័ន្ធ: ' + err.message);
                location.reload();
            }
        }
    </script>
</body>
</html>
